<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – DropNest</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="form-page">
  <main class="auth-wrap">
    <section class="auth-card">
      <div class="app-branding">
        <h1 class="app-name">DropNest</h1>
        <p class="subtitle">Secure file sharing, minus the noise.</p>
      </div>

      <h2>Log in</h2>
      <div id="errorMessage" class="alert alert-error" style="display:none;"></div>

      <form id="loginForm" novalidate>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Enter username" autocomplete="username" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required />

        <button type="submit" class="btn-primary">Log in</button>
      </form>

      <p class="link-row">Don't have an account? <a href="signup.html">Register</a></p>
    </section>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
